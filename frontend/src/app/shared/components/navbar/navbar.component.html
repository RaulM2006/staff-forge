<header class="sf-layout-header">
  <!-- Left: hamburger + branding -->
  <div class="flex items-center gap-3">
    <button mat-icon-button (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="flex items-center gap-2">
      <span class="text-xl font-display font-semibold tracking-tight text-sf-primary">
        StaffForge
      </span>
      <span class="sf-badge sf-badge-info text-xs hidden sm:inline-flex">v0.1</span>
    </div>
  </div>

  <!-- Right: actions + user menu -->
  <div class="flex items-center gap-1">
    <button mat-icon-button aria-label="Notifications" class="hidden sm:inline-flex">
      <mat-icon>notifications_none</mat-icon>
    </button>
    <button mat-icon-button aria-label="Help" class="hidden sm:inline-flex">
      <mat-icon>help_outline</mat-icon>
    </button>

    <!-- User avatar & dropdown -->
    <button mat-icon-button [matMenuTriggerFor]="userMenu" class="ml-1" aria-label="User menu">
      <div class="w-8 h-8 rounded-full bg-sf-primary flex items-center justify-center">
        <span class="text-white text-sm font-medium leading-none">{{ userInitials() }}</span>
      </div>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="px-4 py-3 border-b" style="border-color: var(--sf-color-border)">
        <p class="font-medium" style="color: var(--sf-color-text-main)">{{ userName() }}</p>
        <p class="text-sm" style="color: var(--sf-color-text-muted)">{{ userRoleDisplay() }}</p>
      </div>

      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>

      <!-- Dev Role Switcher -->
      <mat-divider></mat-divider>
      <div class="px-4 py-1.5 text-xs font-semibold uppercase tracking-wider" style="color: var(--sf-color-text-subtle)">
        Comută Rol (Dev)
      </div>
      @for (r of availableRoles; track r) {
        <button mat-menu-item (click)="changeRole.emit(r)">
          <mat-icon style="font-size: 18px; width: 18px; height: 18px;">
            {{ r === user()?.role ? 'check' : 'radio_button_unchecked' }}
          </mat-icon>
          <span [class.font-semibold]="r === user()?.role">{{ formatRole(r) }}</span>
        </button>
      }

      <mat-divider></mat-divider>
      @if (user()) {
        <button mat-menu-item (click)="logout.emit()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      } @else {
        <button mat-menu-item (click)="changeRole.emit(availableRoles[0])">
          <mat-icon>login</mat-icon>
          <span>Login (Dev Mock)</span>
        </button>
      }
    </mat-menu>
  </div>
</header>
