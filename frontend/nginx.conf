server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.csr.html;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Handle Angular SPA routing (prevents 404 on page refresh)
    location / {
        try_files $uri $uri/ /index.html /index.csr.html;
    }

    # Optional Reverse Proxy: forwards /api requests directly to the Spring Boot container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (JS, CSS, images) that have outputHashing enabled
    location ~* \.(?:js|css|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
