services:
  postgres:
    image: postgres:16-alpine
    container_name: staffforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: staffforge
      POSTGRES_USER: staffforge_user
      POSTGRES_PASSWORD: staffforge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffforge_user -d staffforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staffforge-net

  backend:
   build:
     context: ./backend
     dockerfile: Dockerfile
   container_name: staffforge-api
   restart: unless-stopped
   ports:
     - "8080:8080"
   environment:
     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/staffforge
     SPRING_DATASOURCE_USERNAME: staffforge_user
     SPRING_DATASOURCE_PASSWORD: staffforge_password
   depends_on:
     postgres:
       condition: service_healthy
   networks:
     - staffforge-net

  frontend:
   build:
     context: ./frontend
     dockerfile: Dockerfile
   container_name: staffforge-ui
   restart: unless-stopped
   ports:
     - "4200:80"
   depends_on:
     - backend
   networks:
     - staffforge-net

volumes:
  postgres_data:

networks:
  staffforge-net:
    driver: bridge